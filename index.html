<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Trade Barr Terminal Hub</title>
    
    <!-- CHANGE THESE TWO LINES: Add css/ in front -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
    
    <!-- Icons & JS Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .auth-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, var(--panel-bg) 0%, var(--bg-dark) 100%);
        }
        .auth-box {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            margin-bottom: 2rem;
            letter-spacing: 2px;
        }
        .error-message {
            color: var(--loss-red);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="glass-panel auth-box">
            <h1 class="logo"><span class="text-gold">TRADE</span>BARR</h1>
            <p class="text-muted" style="margin-bottom: 2rem;">Trade Barr Terminal Hub</p>

            <div id="error-msg" class="error-message"></div>

            <form id="login-form">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                
                <button type="submit" class="btn-gold" style="width: 100%; margin-top: 1rem;" id="login-btn">
                    Access Terminal
                </button>
            </form>
            
            <p class="text-muted" style="margin-top: 1.5rem; font-size: 0.9rem;">
                Don't have an account? <a href="#" id="toggle-auth" class="text-gold">Request Access</a>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</body>
</html>
