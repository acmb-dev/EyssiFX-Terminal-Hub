<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Barr - Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-container {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            color: #D4AF37;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .logo span {
            color: #ffffff;
        }

        .subtitle {
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #a0aec0;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background: #1e222d;
            border: 1px solid #363c4e;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #D4AF37;
        }

        .login-btn {
            background: #D4AF37;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #b5952f;
        }

        .error-msg {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }

        .toggle-mode {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #a0aec0;
        }

        .toggle-mode span {
            color: #D4AF37;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">TRADE<span>BARR</span></div>
        <div class="subtitle" id="form-subtitle">Terminal Hub Login</div>

        <form id="authForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <!-- This field is hidden by default, only shows on Sign Up -->
            <div class="input-group" id="confirm-group" style="display: none;">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
            </div>

            <div class="input-group" id="auth-code-group" style="display: none;">
    <label>Authentication Code</label>
    <div style="display: flex; gap: 8px;">
        <input type="text" id="authCode" placeholder="e.g. A8X2B91M" style="margin-bottom: 0;">
        <button type="button" class="login-btn" style="margin-top: 0; padding: 0 15px; width: auto;" onclick="window.location.href='mailto:aldrinneust@gmail.com?subject=Trade%20Barr%20Access%20Request&body=Hi%20Admin,%20I%20would%20like%20to%20purchase%20an%20access%20code.'">
            <i class="fas fa-envelope"></i> Request
        </button>
    </div>
            </div>

            <button type="submit" class="login-btn" id="auth-btn">
                <i class="fas fa-lock" style="margin-right: 8px;"></i> Authenticate
            </button>
            
            <div id="error-message" class="error-msg"></div>

            <div class="toggle-mode" id="toggle-text">
                Don't have an account? <span onclick="toggleMode()">Sign Up</span>
            </div>
        </form>
    </div>

<script>
let isLoginMode = true; // Tracks if we are logging in or signing up

// --- OFFICIAL WHITE-LISTED ACCESS CODES ---
const VALID_CODES = [
    "K8M2Q91D", "X4P8L21D", "A9T3V61D", "R2N7B51D", "W8C1J41D", "F6Y9D31D", "M3K8Z11D", "H5Q2X71D", "B4V9N61D", "T7L1P81D", "C2R6W91D", "J8A3F51D", "N4X7K21D", "P9D5M11D", "V3B8Q61D", "L6T2H91D", "Z1F4R71D", "Q5N9C31D", "D8W2Y61D", "G3J7A41D", 
    "Y6K2M87D", "C9P4R17D", "N3V7X57D", "B8T2Q67D", "F1L9D47D", "W5A3K77D", "R7X2J97D", "M4Q8C17D", "T6N3B57D", "H9V1P77D", "A2D6Y87D", "K5R9F37D", "X1C4M77D", "P8J2W67D", "D3Z7L57D", "V9B4T27D", "Q6H1N87D", "L2F5A97D", "G7M3X47D", "J4Y8R17D", 
    "P3X7K91M", "A6N2W41M", "Z8R5C11M", "T4J9M21M", "B7Q3L61M", "F2V8D51M", "K9Y1P41M", "W3C6N71M", "R5M2X81M", "D1L7A91M", "H4T8Q31M", "N6B1Z51M", "X7P3F21M", "C8J4V61M", "M2R9K51M", "Y5D1W81M", "L9A3T71M", "Q4X6B21M", "V1N8H31M", "J7F5C91M", 
    "R8K3V13M", "X5D9P23M", "B1M7Q43M", "T9C2L63M", "H3W8N53M", "A7F4Y13M", "K2J6R93M", "P5V1D83M", "N9X3B73M", "C4Q8M23M", "W1L6T53M", "D7R2A93M", "Y3H5K83M", "M6P9X13M", "F8B4N23M", "Q1T7C53M", "L4V9J33M", "Z2A6W83M", "G5N1R73M", "J9C3D43M", 
    "V4K8M21Y", "D9Q3X71Y", "L1B6T51Y", "A8R2N41Y", "Y7C5P11Y", "M3W9F61Y", "Q2J8H41Y", "T5X1D71Y", "B6N4K91Y", "P1V7C31Y", "X9L2R51Y", "H8M4A11Y", "C3T7Q61Y", "R6Y1N81Y", "F2D9W51Y", "K7P3B41Y", "N5A8V21Y", "W4J6X91Y", "Z1C5M71Y", "G8Q2L41Y", 
    "J5R8X2LT", "M9C4V1LT", "A3K7P6LT", "W2N8D5LT", "Q7F1B9LT", "X4T6H3LT", "B8Y2M5LT", "L3V9R1LT", "D6P4K8LT", "T1Z7C5LT", "N8A2W6LT", "F5J3Q9LT", "R4M7X1LT", "C9H2V8LT", "Y6B1D4LT", "P2K5N7LT", "G7W3A8LT", "Z4L9T2LT", "H1Q6F5LT", "V8D3J7LT"
];

// --- HELPER FUNCTION: CALCULATE REMAINING TIME ---
function getRemainingTimeString(expiry) {
    if (!expiry || expiry === 'LT') return 'Lifetime Access (Unlimited)';
    
    const expiryTime = parseInt(expiry, 10);
    const now = Date.now();
    const diffMs = expiryTime - now;
    
    if (diffMs <= 0) return 'Expired';
    
    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    
    if (days > 0) {
        return `${days} Days, ${hours} Hours remaining`;
    } else if (hours > 0) {
        return `${hours} Hours, ${minutes} Minutes remaining`;
    } else {
        return `${minutes} Minutes remaining`;
    }
}

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired') === 'true') {
        Swal.fire({
            title: 'Access Expired',
            html: '<p style="color: #a0aec0;">Your subscription duration has ended. Please purchase a new access code to continue using the terminal.</p>',
            icon: 'warning',
            background: '#131722',
            color: '#ffffff',
            confirmButtonColor: '#d4af37',
            confirmButtonText: 'Understood'
        });
        window.history.replaceState({}, document.title, "index.html");
    }
};

function toggleMode() {
    isLoginMode = !isLoginMode;
    const confirmGroup = document.getElementById('confirm-group');
    const authCodeGroup = document.getElementById('auth-code-group');
    const authBtn = document.getElementById('auth-btn');
    const toggleText = document.getElementById('toggle-text');
    const subtitle = document.getElementById('form-subtitle');
    const errorMsg = document.getElementById('error-message');

    errorMsg.style.display = 'none';
    document.getElementById('confirmPassword').value = '';
    document.getElementById('authCode').value = '';

    if (isLoginMode) {
        confirmGroup.style.display = 'none';
        authCodeGroup.style.display = 'none';
        document.getElementById('confirmPassword').removeAttribute('required');
        document.getElementById('authCode').removeAttribute('required');
        
        subtitle.innerText = 'Terminal Hub Login';
        authBtn.innerHTML = '<i class="fas fa-lock" style="margin-right: 8px;"></i> Authenticate';
        toggleText.innerHTML = 'Don\'t have an account? <span onclick="toggleMode()">Sign Up</span>';
    } else {
        confirmGroup.style.display = 'block';
        authCodeGroup.style.display = 'block';
        document.getElementById('confirmPassword').setAttribute('required', 'true');
        document.getElementById('authCode').setAttribute('required', 'true');
        
        subtitle.innerText = 'Register New Account';
        authBtn.innerHTML = '<i class="fas fa-user-plus" style="margin-right: 8px;"></i> Create Account';
        toggleText.innerHTML = 'Already have an account? <span onclick="toggleMode()">Log In</span>';
    }
}

document.getElementById('authForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-message');

    const storageKey = 'supreme_user_' + user;

    if (!isLoginMode) {
        // --- SIGN UP LOGIC ---
        const confirmPass = document.getElementById('confirmPassword').value;
        const authCodeValue = document.getElementById('authCode').value.trim().toUpperCase();

        if (pass !== confirmPass) {
            errorMsg.innerText = "Passwords do not match.";
            errorMsg.style.display = 'block';
            return;
        }

        if (localStorage.getItem(storageKey)) {
            errorMsg.innerText = "Username already exists. Please log in.";
            errorMsg.style.display = 'block';
            return;
        }

        // --- VALIDATE AGAINST OFFICIAL CODE LIST ---
        if (!VALID_CODES.includes(authCodeValue)) {
            errorMsg.innerText = "Invalid access code. Please enter a valid purchased code.";
            errorMsg.style.display = 'block';
            return;
        }

        // --- PREVENT CODE RE-USE (SINGLE-USE PROTECTION) ---
        if (localStorage.getItem('used_code_' + authCodeValue)) {
            errorMsg.innerText = "This access code has already been used.";
            errorMsg.style.display = 'block';
            return;
        }

        // --- AUTOMATIC TIME LIMIT CALCULATION FROM CODE SUFFIX ---
        let expiryDate = new Date();
        let hasLimit = true;

        if (authCodeValue.includes('7D')) {
            expiryDate.setDate(expiryDate.getDate() + 7);
        } else if (authCodeValue.includes('1D')) {
            expiryDate.setDate(expiryDate.getDate() + 1);
        } else if (authCodeValue.includes('3M')) {
            expiryDate.setMonth(expiryDate.getMonth() + 3);
        } else if (authCodeValue.includes('1M')) {
            expiryDate.setMonth(expiryDate.getMonth() + 1);
        } else if (authCodeValue.includes('1Y')) {
            expiryDate.setFullYear(expiryDate.getFullYear() + 1);
        } else if (authCodeValue.includes('LT')) {
            hasLimit = false;
        } else {
            expiryDate.setMonth(expiryDate.getMonth() + 1); // Default fallback
        }

        const expirationTime = hasLimit ? expiryDate.getTime() : 'LT';
        
        // Save credentials, expiration, and mark code as consumed
        localStorage.setItem(storageKey, pass);
        localStorage.setItem(storageKey + '_expiry', expirationTime);
        localStorage.setItem('used_code_' + authCodeValue, 'true');

        localStorage.setItem('current_user', user);
        localStorage.setItem('supreme_auth', 'true');

        const timeLeftText = getRemainingTimeString(expirationTime);

        Swal.fire({
            title: 'Account Registered!',
            html: `<p style="color: #a0aec0; margin-bottom: 12px;">Welcome <b>${user}</b>!</p>
                   <div style="background: #1a1d24; border: 1px solid #d4af37; padding: 12px; border-radius: 6px; color: #d4af37; font-weight: bold; font-size: 1rem;">
                       ⏳ Access Duration: ${timeLeftText}
                   </div>`,
            icon: 'success',
            background: '#131722',
            color: '#ffffff',
            confirmButtonColor: '#d4af37',
            confirmButtonText: 'Enter Dashboard'
        }).then(() => {
            window.location.href = 'dashboard.html';
        });

    } else {
        // --- LOG IN LOGIC ---
        const storedPass = localStorage.getItem(storageKey);

        if ((user === 'admin' && pass === 'supreme2026') || (storedPass && storedPass === pass)) {
            
            let userExpiry = 'LT';
            if (user !== 'admin') {
                userExpiry = localStorage.getItem(storageKey + '_expiry');
                if (userExpiry && userExpiry !== 'LT' && Date.now() > parseInt(userExpiry)) {
                    errorMsg.innerText = "Your access has expired. Please purchase a new code.";
                    errorMsg.style.display = 'block';
                    return;
                }
            }

            localStorage.setItem('current_user', user);
            localStorage.setItem('supreme_auth', 'true');

            const timeLeftText = (user === 'admin') ? 'Lifetime Access (Unlimited)' : getRemainingTimeString(userExpiry);

            Swal.fire({
                title: 'Access Granted!',
                html: `<p style="color: #a0aec0; margin-bottom: 12px;">Welcome back, <b>${user}</b>!</p>
                       <div style="background: #1a1d24; border: 1px solid #d4af37; padding: 12px; border-radius: 6px; color: #d4af37; font-weight: bold; font-size: 1rem;">
                           ⏳ Time Remaining: ${timeLeftText}
                       </div>`,
                icon: 'success',
                background: '#131722',
                color: '#ffffff',
                confirmButtonColor: '#d4af37',
                confirmButtonText: 'Open Dashboard'
            }).then(() => {
                window.location.href = 'dashboard.html';
            });

        } else {
            errorMsg.innerText = "Invalid credentials. Please try again.";
            errorMsg.style.display = 'block';
        }
    }
});
</script>           
</body>
</html>
