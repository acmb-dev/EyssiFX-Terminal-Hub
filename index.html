<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Barr - Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login-container {
            background: #131722;
            border: 1px solid #2a2e39;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            color: #D4AF37;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .logo span {
            color: #ffffff;
        }

        .subtitle {
            color: #a0aec0;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #a0aec0;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            background: #1e222d;
            border: 1px solid #363c4e;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #D4AF37;
        }

        .login-btn {
            background: #D4AF37;
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #b5952f;
        }

        .error-msg {
            color: #ff4444;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }

        .toggle-mode {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #a0aec0;
        }

        .toggle-mode span {
            color: #D4AF37;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">TRADE<span>BARR</span></div>
        <div class="subtitle" id="form-subtitle">Terminal Hub Login</div>

        <form id="authForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <!-- This field is hidden by default, only shows on Sign Up -->
            <div class="input-group" id="confirm-group" style="display: none;">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password">
            </div>

            <button type="submit" class="login-btn" id="auth-btn">
                <i class="fas fa-lock" style="margin-right: 8px;"></i> Authenticate
            </button>
            
            <div id="error-message" class="error-msg"></div>

            <div class="toggle-mode" id="toggle-text">
                Don't have an account? <span onclick="toggleMode()">Sign Up</span>
            </div>
        </form>
    </div>

    <script>
        let isLoginMode = true; // Tracks if we are logging in or signing up

        function toggleMode() {
            isLoginMode = !isLoginMode;
            const confirmGroup = document.getElementById('confirm-group');
            const authBtn = document.getElementById('auth-btn');
            const toggleText = document.getElementById('toggle-text');
            const subtitle = document.getElementById('form-subtitle');
            const errorMsg = document.getElementById('error-message');
            
            // Clear errors and fields when switching
            errorMsg.style.display = 'none';
            document.getElementById('confirmPassword').value = '';

            if (isLoginMode) {
                // Switch to Login UI
                confirmGroup.style.display = 'none';
                document.getElementById('confirmPassword').removeAttribute('required');
                subtitle.innerText = 'Terminal Hub Login';
                authBtn.innerHTML = '<i class="fas fa-lock" style="margin-right: 8px;"></i> Authenticate';
                toggleText.innerHTML = 'Don\'t have an account? <span onclick="toggleMode()">Sign Up</span>';
            } else {
                // Switch to Sign Up UI
                confirmGroup.style.display = 'block';
                document.getElementById('confirmPassword').setAttribute('required', 'true');
                subtitle.innerText = 'Register New Account';
                authBtn.innerHTML = '<i class="fas fa-user-plus" style="margin-right: 8px;"></i> Create Account';
                toggleText.innerHTML = 'Already have an account? <span onclick="toggleMode()">Log In</span>';
            }
        }

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            
            // Unique key to save this specific user in local storage
            const storageKey = 'supreme_user_' + user;

            if (!isLoginMode) {
                // --- SIGN UP LOGIC ---
                const confirmPass = document.getElementById('confirmPassword').value;

                if (pass !== confirmPass) {
                    errorMsg.innerText = "Passwords do not match.";
                    errorMsg.style.display = 'block';
                    return;
                }

                if (localStorage.getItem(storageKey)) {
                    errorMsg.innerText = "Username already exists. Please log in.";
                    errorMsg.style.display = 'block';
                    return;
                }

                // Save the new user and password to local storage
                localStorage.setItem(storageKey, pass);
                
                // Automatically log them in after creating the account
                localStorage.setItem('supreme_auth', 'true');
                window.location.href = 'dashboard.html';

            } else {
                // --- LOG IN LOGIC ---
                const storedPass = localStorage.getItem(storageKey);

                // Check if they are the admin OR if their stored password matches
                if ((user === 'admin' && pass === 'supreme2026') || (storedPass && storedPass === pass)) {
                    localStorage.setItem('supreme_auth', 'true');
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.innerText = "Invalid credentials. Please try again.";
                    errorMsg.style.display = 'block';
                }
            }
        });
    </script>
</body>
</html>
